[project]
name = "catraca"
version = "0.1.0"
description = "Catraca: venda de ingressos para eventos pequenos (MVP do desafio Full Cycle)"
requires-python = "==3.13.*"
dependencies = [
    "django==5.2.19",
    "psycopg[binary]==3.3.9",
    "gunicorn==27.0.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-django==4.14.0",
    "ruff==0.17.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "catraca.settings"
python_files = ["test_*.py"]
testpaths = ["dominio", "web", "api_parceiros"]
addopts = "-p no:cacheprovider --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
