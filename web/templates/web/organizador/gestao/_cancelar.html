<section id="evento-cancelar">
  {% if evento.pode_ser_cancelado %}
    <form id="form-cancelar" method="post" action="/organizador/eventos/{{ evento.id_publico }}/cancelar/"
          onsubmit="return confirm('Cancelar este evento? Esta ação não pode ser desfeita.')">
      {% csrf_token %}
      <button type="submit">Cancelar evento</button>
    </form>
  {% elif not evento.pode_ser_editado %}
    <p>Este evento foi cancelado.</p>
  {% endif %}
</section>
