<section id="evento-acoes">
  {% if evento.pode_ser_editado %}<a href="/organizador/eventos/{{ evento.id_publico }}/editar/">Editar</a>{% endif %}
  {% if evento.pode_ser_publicado %}
    <form method="post" action="/organizador/eventos/{{ evento.id_publico }}/publicar/" class="form-inline">
      {% csrf_token %}
      <button type="submit">Publicar</button>
    </form>
  {% endif %}
</section>
